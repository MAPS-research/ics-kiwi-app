name: css-kiwi-demo
services:
  db:
    image: pgvector/pgvector:0.7.2-pg16
    environment:
      POSTGRES_USER: kiwi_demo
      POSTGRES_PASSWORD: ${KIWI_DEMO_DB_PASSWORD:?Run local setup first}
      POSTGRES_DB: kiwi_demo
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kiwi_demo -d kiwi_demo']
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2.5-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30
  oss:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ROOT_USER: ${KIWI_DEMO_OSS_USER:?Run local setup first}
      MINIO_ROOT_PASSWORD: ${KIWI_DEMO_OSS_PASSWORD:?Run local setup first}
    command: ['server', '/data', '--console-address', ':9001']
    ports:
      - '127.0.0.1:9002:9000'
      - '127.0.0.1:9003:9001'
    volumes:
      - oss-data:/data
volumes:
  db-data:
  redis-data:
  oss-data:
